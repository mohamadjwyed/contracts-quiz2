<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر أصول المحاكمات المدنية (٢) — إيوان التعليمي</title>
<style>
  :root{
    --bg:#f6f3ec; --card:#ffffff; --ink:#2b2620; --muted:#6b6255;
    --brand:#7a5c3e; --brand-dark:#513d29; --accent:#b08b5a;
    --good:#3f7d5c; --good-bg:#eaf5ee; --bad:#b3503f; --bad-bg:#fbeae7;
    --trap-bg:#fff6e6; --trap-border:#e0b45a;
    --ex-bg:#eef3f6; --ex-border:#7a9cae;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.8;
  }
  .wrap{max-width:820px; margin:0 auto; padding:18px 16px 60px}
  header.hero{
    text-align:center; padding:28px 18px 22px; background:linear-gradient(135deg,var(--brand-dark),var(--brand));
    color:#fff; border-radius:0 0 22px 22px; margin-bottom:18px;
  }
  header.hero .bismillah{font-size:1.05rem; opacity:.92; margin-bottom:6px}
  header.hero h1{margin:6px 0 4px; font-size:1.5rem}
  header.hero p{margin:2px 0; opacity:.9; font-size:.95rem}
  header.hero a.wa{
    display:inline-block; margin-top:14px; background:#25d366; color:#fff; text-decoration:none;
    padding:9px 18px; border-radius:24px; font-weight:600; font-size:.9rem; box-shadow:0 3px 10px rgba(0,0,0,.15);
  }
  nav.tabs{
    display:flex; gap:8px; position:sticky; top:0; background:var(--bg); z-index:20; padding:8px 0 12px;
  }
  nav.tabs button{
    flex:1; padding:12px 8px; border:none; border-radius:12px; background:#eee3d3; color:var(--brand-dark);
    font-weight:700; font-size:.95rem; cursor:pointer; transition:.2s;
  }
  nav.tabs button.active{background:var(--brand); color:#fff; box-shadow:0 3px 10px rgba(122,92,62,.35)}

  section{display:none}
  section.active{display:block}

  /* ===== Explanation section ===== */
  .unit{
    background:var(--card); border-radius:16px; padding:18px 18px 16px; margin-bottom:14px;
    box-shadow:0 2px 10px rgba(0,0,0,.05); border-inline-start:5px solid var(--brand);
  }
  .unit h3{margin:0 0 10px; color:var(--brand-dark); font-size:1.1rem}
  .unit ul{margin:0 0 12px; padding-inline-start:20px}
  .unit li{margin-bottom:7px; font-size:.95rem}
  .tag{
    display:flex; gap:8px; align-items:flex-start; padding:10px 12px; border-radius:10px; font-size:.88rem; margin-top:8px;
  }
  .tag.trap{background:var(--trap-bg); border:1px solid var(--trap-border)}
  .tag.example{background:var(--ex-bg); border:1px solid var(--ex-border)}
  .tag b{white-space:nowrap}

  /* ===== Quiz section ===== */
  .quiz-top{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px;
  }
  .progress-wrap{flex:1; min-width:150px; background:#e6ddc9; border-radius:20px; height:10px; overflow:hidden}
  .progress-bar{height:100%; background:var(--brand); width:0%; transition:.3s}
  .score-badge{
    background:var(--card); border-radius:12px; padding:6px 14px; font-weight:700; font-size:.85rem;
    box-shadow:0 2px 6px rgba(0,0,0,.06);
  }
  .qcount{font-size:.82rem; color:var(--muted)}

  .qcard{
    background:var(--card); border-radius:18px; padding:20px; box-shadow:0 3px 14px rgba(0,0,0,.07); margin-bottom:16px;
  }
  .qcard h4{margin:0 0 16px; font-size:1.05rem; color:var(--brand-dark); line-height:1.7}
  .opt{
    display:block; width:100%; text-align:right; background:#faf8f3; border:2px solid #e6ddc9; border-radius:12px;
    padding:12px 14px; margin-bottom:10px; font-size:.93rem; cursor:pointer; transition:.15s; color:var(--ink);
  }
  .opt:hover{border-color:var(--accent)}
  .opt.correct{background:var(--good-bg); border-color:var(--good); color:#1f4a34; font-weight:700}
  .opt.wrong{background:var(--bad-bg); border-color:var(--bad); color:#7a3226; font-weight:700}
  .opt.disabled{cursor:default; pointer-events:none}
  .opt.dim{opacity:.55}

  .cards4{display:none; margin-top:16px; gap:10px; flex-direction:column}
  .cards4.show{display:flex}
  .minicard{border-radius:12px; padding:12px 14px; font-size:.88rem}
  .minicard .lbl{font-weight:800; font-size:.78rem; margin-bottom:4px; display:block}
  .mc-legal{background:#f1ece1; border-inline-start:4px solid var(--brand)}
  .mc-simple{background:#eef3f6; border-inline-start:4px solid var(--ex-border)}
  .mc-example{background:#eaf5ee; border-inline-start:4px solid var(--good)}
  .mc-trap{background:var(--trap-bg); border-inline-start:4px solid var(--trap-border)}

  .nextbtn{
    display:none; margin-top:16px; width:100%; padding:13px; border:none; border-radius:12px;
    background:var(--brand); color:#fff; font-weight:700; font-size:.95rem; cursor:pointer;
  }
  .nextbtn.show{display:block}

  .result{
    text-align:center; background:var(--card); border-radius:18px; padding:32px 20px; box-shadow:0 3px 14px rgba(0,0,0,.08);
  }
  .result h2{color:var(--brand-dark); margin-top:0}
  .result .big{font-size:2.6rem; font-weight:800; color:var(--brand); margin:10px 0}
  .restartbtn{
    margin-top:16px; padding:12px 24px; border:none; border-radius:12px; background:var(--brand);
    color:#fff; font-weight:700; cursor:pointer; font-size:.95rem;
  }

  footer{text-align:center; margin-top:30px; padding-top:18px; border-top:1px solid #e0d7c4; color:var(--muted); font-size:.85rem}
  footer b{color:var(--brand-dark)}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="bismillah">بسم الله نبدأ</div>
    <h1>⚖️ دفتر أصول المحاكمات المدنية (٢)</h1>
    <p>تطبيق إيوان التعليمي — يتمنى لكم التوفيق والنجاح</p>
    <a class="wa" href="https://chat.whatsapp.com/FKynKa5tMAiEGP6JRJ2F26?s=cl&p=a&mlu=4&ilr=4" target="_blank">💬 انضم لمجموعة الواتساب</a>
  </header>

  <nav class="tabs">
    <button id="tab-study" class="active" onclick="showTab('study')">📖 قسم الشرح</button>
    <button id="tab-quiz" onclick="showTab('quiz')">📝 الاختبار التفاعلي (١٠٠ سؤال)</button>
  </nav>

  <section id="study" class="active"></section>

  <section id="quiz">
    <div class="quiz-top">
      <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <div class="qcount" id="qcount">سؤال ١ من ١٠٠</div>
      <div class="score-badge">✅ <span id="scoreNum">0</span></div>
    </div>
    <div id="quizArea"></div>
  </section>

  <footer>
    إعداد <b>خالد الحمد</b>
  </footer>
</div>

<script>
const DATA = {"units": [{"title": "الوحدة ١ — نظرية بطلان الإجراءات", "points": ["يكون الإجراء باطلاً في حالتين فقط: (١) إذا نص القانون صراحة على بطلانه (٢) إذا شابه عيب لم تتحقق به الغاية من الإجراء، حتى لو لم ينص القانون على البطلان صراحة.", "لا يحكم بالبطلان رغم وجود نص صريح عليه إذا ثبت أن الغاية من الإجراء قد تحققت فعلاً رغم العيب.", "يزول البطلان إذا تنازل عنه من شُرع البطلان لمصلحته (كالخصم المتضرر من الإجراء المعيب).", "إذا كان بطلان الإجراء متعلقاً بالنظام العام، فلا يزول بالتنازل عنه من أي من الخصوم.", "عدم ذكر موطن مختار في استدعاء الدعوى يكون الاستدعاء باطلاً إذا ترتب على ذلك ضرر فعلي بحسب الأصل."], "trap": "البطلان ليس مطلقاً بمجرد مخالفة الشكل — لازم إثبات عدم تحقق الغاية من الإجراء، وهذا ما يسمى «نظرية الغاية من الإجراء»، وهي التي تُطبَّق في حال تخلف ذكر الموطن المختار في استدعاء الدعوى تحديداً. لا تخلط بين البطلان النسبي (يزول بالتنازل) والبطلان المتعلق بالنظام العام (لا يزول بالتنازل).", "example": "محامٍ بالحسكة رفع دعوى ونسي ذكر موطن مختار لموكله في الاستدعاء — لا يُحكم بالبطلان تلقائياً، بل تنظر المحكمة هل ترتب ضرر فعلي على المدعى عليه من هذا النقص أم لا."}, {"title": "الوحدة ٢ — استدعاء الدعوى وقيدها وآثاره", "points": ["يُبدى استدعاء الدعوى من قبل المدعي أو المحامي الوكيل، ويُقدَّم إلى ديوان المحكمة.", "يصح أن ترفع الدعوى من الوكيل ولو لم يكن محامياً، إذا كان يصح رفعها من المدعي نفسه (كالدعاوى المعفاة من وجوب التوكيل بمحام).", "يترتب من تاريخ قيد الدعوى في السجل: الآثار التي تترتب على تاريخ رفع الدعوى، وقطع التقادم، وسريان فوائد التأخير.", "يجب أن يتضمن استدعاء الدعوى بيانات إلزامية منها: اسم المحكمة المرفوعة أمامها، تاريخ تحرير الاستدعاء، اسم كل من المدعي والمدعى عليه ونسبته وموطنه، بيان موضوع الدعوى، عرض الأوجه القانونية التي تؤسس عليها الدعوى، ذكر البيانات والأدلة التي يستند إليها المدعي لتأييد دعواه.", "توقيع المدعي أو وكيله متى كان الوكيل محامياً مفروضاً بسند رسمي."], "trap": "تاريخ القيد في سجل الدعوى (لا تاريخ التبليغ اللاحق) هو الذي يُعتد به لقطع التقادم وسريان فوائد التأخير — نقطة كثيراً ما تُختبر بالخلط بين تاريخ الرفع وتاريخ التبليغ.", "example": "مواطن بالقامشلي أراد قطع تقادم دين قبل انتهاء المدة القانونية، فبادر بقيد دعواه في ديوان المحكمة رسمياً، فانقطع التقادم من تاريخ القيد ذاته بغض النظر عن موعد التبليغ اللاحق للمدعى عليه."}, {"title": "الوحدة ٣ — نظام تبادل اللوائح والقرار الإعدادي", "points": ["في الدعاوى الخاضعة لتبادل اللوائح، يجب على المدعى عليه أو وكيله تقديم جواب كتابي عن الدعوى خلال ثمانية أيام من تاريخ تبليغه استدعاءها، مرفقاً بالأوراق المستند إليها مع صور بعدد الخصوم.", "النظام الذي يعرف بتبادل الوثائق بين المدعي والمدعى عليه هو نظام تبادل اللوائح — وهو مهجور في الواقع العملي حالياً.", "يُعيّن رئيس المحكمة موعد جلسة المحاكمة الأولى في الدعاوى الخاضعة لتبادل اللوائح بعد انقضاء ثلاثة أيام من تاريخ تبليغ جواب المدعى عليه إلى المدعي، أو في اليوم التالي لانقضاء أجل الثمانية أيام الذي كان ينبغي أن يرد فيه الجواب.", "القرار الإعدادي في معرض تبادل اللوائح: هو القرار الذي لا يُنهي الخصومة، كقرار إجراء الخبرة أو سماع الشهود، وذلك بعكس الحكم النهائي الذي يُنهي الخصومة.", "للمحكمة أن تنطق بالحكم المنهي للخصومة في جلسة المحاكمة الأولى ذاتها إذا كانت الدعوى جاهزة للحكم.", "إذا تأخر رئيس المحكمة عن تعيين موعد الجلسة بعد المواعيد المحددة، فلا يترتب على ذلك أي بطلان.", "إذا طلب المدعى عليه في جوابه «إرجاء» (أي تأجيل) الرد، يجوز لرئيس المحكمة وحده السماح للمدعى عليه بذلك."], "trap": "مهلة الثمانية أيام لتقديم جواب المدعى عليه تخص فقط الدعاوى الخاضعة لتبادل اللوائح — لا تعمم هذه المهلة على كل أنواع الدعاوى؛ الدعاوى البسيطة والصلحية والمستعجلة تُعيَّن لها الجلسة فور الاستدعاء دون هذه المهلة.", "example": "شركة بالحسكة رفعت دعوى تجارية خاضعة لتبادل اللوائح، فأمهل المدعى عليه ثمانية أيام لتقديم جوابه الكتابي، وبعدها بثلاثة أيام إضافية عيّن رئيس المحكمة موعد الجلسة الأولى."}, {"title": "الوحدة ٤ — الدعوى البسيطة ومواعيد الحضور", "points": ["الدعوى البسيطة يُقصد بها في السياق التشريعي والممارسة العملية: الدعوى غير الخاضعة لتبادل اللوائح، وكذلك الدعوى الصلحية والمستعجلة بقوة القانون.", "يملك رئيس المحكمة وحده صلاحية اعتبار الدعوى بسيطة بقرار خاص، يصدره أسفل استدعاء الدعوى.", "في الدعاوى البسيطة والصلحية والمستعجلة، يُعيّن القاضي جلسة المحاكمة فور استدعائها دون حاجة لقرار من رئيس المحكمة.", "المطلوب من المدعى عليه ووكيله في أول جلسة خصومة في الدعاوى البسيطة: تقديم دفوعه وأدلته كاملة دفعة واحدة.", "ميعاد الحضور أمام محاكم الصلح والبداية والاستئناف: ثلاثة أيام على الأقل، ويجوز إنقاصه إلى ٢٤ ساعة في حال الضرورة.", "ميعاد الحضور في الدعاوى المستعجلة: ٢٤ ساعة، ويجوز إنقاصه إلى ساعة واحدة في حال الضرورة القصوى وبشرط تبليغ الخصم نفسه مباشرة (لا بالإلصاق على لوحة الإعلانات).", "يملك صلاحية تقصير ميعاد الحضور المحكمةُ المرفوعة إليها الدعوى نفسها.", "يمكن القاضي منح أطراف الدعوى البسيطة مهلة إضافية لمرة واحدة فقط وفي حالة الضرورة."], "trap": "الفرق بين ميعاد الحضور العادي (٣ أيام قابل للتخفيض إلى ٢٤ ساعة للضرورة) وميعاد الدعوى المستعجلة (٢٤ ساعة أصلاً قابل للتخفيض إلى ساعة واحدة للضرورة القصوى) — أربعة أرقام متقاربة يسهل الخلط بينها؛ اربطها بنوع الدعوى تحديداً لا كأرقام منفصلة.", "example": "صاحب محل بالقامشلي رفع دعوى مستعجلة لإخلاء عقار مهدد بالانهيار، فقرر القاضي تقصير ميعاد الحضور إلى ساعة واحدة فقط نظراً للضرورة القصوى، وبلّغ الخصم شخصياً ومباشرة."}, {"title": "الوحدة ٥ — وجوب التوكيل بمحام واستثناءاته", "points": ["القاعدة العامة في أصول المحاكمات: لا يجوز للخصوم الحضور أمام المحاكم إلا بواسطة محامٍ موكَّل بسند توكيل، رعايةً لمصالح الخصوم وضماناً لحقوقهم.", "يُستثنى من قاعدة لزوم توكيل محام حالات محددة، منها: دعاوى الحقوق الشخصية التي تنصب المطالبة فيها على مبلغ نقدي لا يزيد على مئة ألف ليرة سورية، والقضايا الشرعية عدا دعاوى النسب والإرث والوقف.", "دعاوى النسب والإرث والوقف تبقى خاضعة لوجوب التوكيل بمحام رغم كونها قضايا شرعية، لأنها استثناء من الاستثناء."], "trap": "وجوب التوكيل بمحام في القضايا الشرعية معكوس جزئياً: الأصل الاستثناء (عدم الوجوب) لكن دعاوى النسب والإرث والوقف تعود لتطبيق القاعدة العامة (وجوب التوكيل) — نقطة عكسية دقيقة يسهل الوقوع في فخها.", "example": "مواطن يطالب بمبلغ ٨٠ ألف ليرة سورية (أقل من ١٠٠ ألف) يمكنه الحضور أمام المحكمة بنفسه دون توكيل محام؛ لكن لو كانت دعواه تتعلق بالإرث فهو ملزم بتوكيل محام رغم كونها قضية شرعية."}, {"title": "الوحدة ٦ — الإنابة بين المحامين والوكالة", "points": ["منع الوكيل (المحامي) من أن ينيب غيره يجب أن يكون صريحاً في سند الوكالة حتى يُعتد به؛ فإن كان المنع ضمنياً فلا يمنع الإنابة.", "المحامي المتمرن ينوب حكماً عن أستاذه دون حاجة لذكر اسمه أو صك إنابته.", "يجوز للقضاة والنائب العام ومعاونيه والعاملين في المحاكم التوكل عن الغير في دعاويهم الشخصية فقط، وعن أزواجهم وأقاربهم حتى الدرجة الثانية.", "قاعدة منع القضاة والعاملين في المحاكم من قبول الوكالة العامة عن الغير: تتعلق بالنظام العام.", "لا يجوز لكاتب محكمة أن ينوب حكماً عن أستاذه المحامي المتمرن دون ذكر اسمه أو صك إنابته — هذا الحكم خاص بالمحامي المتمرن حصراً لا بأي شخص آخر."], "trap": "استثناء التوكل الشخصي للقضاة والعاملين بالمحاكم مقيد بشرطين معاً: (١) دعاواهم الشخصية أو دعاوى أزواجهم وأقاربهم (٢) حتى الدرجة الثانية فقط — تجاوز الدرجة الثانية أو التوكل عن أجنبي يخالف قاعدة النظام العام.", "example": "قاضٍ بمحكمة الحسكة يمكنه أن يوكّل نفسه بالدفاع عن قضية شخصية تخصه أو تخص زوجته أو والده (الدرجة الثانية)، لكن لا يجوز له أن يتوكل عن صديق أو قريب بعيد."}, {"title": "الوحدة ٧ — الوجاهية والمحاكمة بمثابة الوجاهي والمعذرة", "points": ["الأصل وفق قانون أصول المحاكمات: لا يجوز أن تجري المحاكمة إلا بصورة وجاهية أو بمثابة الوجاهي — المحاكمة الغيابية غير جائزة في المدني.", "تعتبر المحاكمة «بمثابة الوجاهي» إذا لم يحضر الخصم رغم تبليغه أصولاً.", "إذا حضر أحد الخصمين في جلسة ثم تغيّب لاحقاً، تُعتبر المحاكمة بحقه بمثابة الوجاهي في الجلسات التالية.", "إذا لم يحضر المدعى عليه في الجلسة الأولى وكان مبلّغاً بالخيار، فللمدعي الخيار: إما طلب إعادة تبليغ الدعوى، أو طلب الحكم في الموضوع مباشرة.", "عند طلب إعادة تبليغ الدعوى على المدعى عليه الغائب، يجب تأجيل الجلسة وإبلاغ المدعى عليه بميعاد الجلسة الثانية.", "إذا طلب المدعى عليه شطب الدعوى بسبب غياب المدعي، فللمحكمة سلطة تقديرية بالموافقة أو الرفض، وليس التزاماً مطلقاً.", "المعذرة عن التخلف عن الحضور: لم يحدد المشرع شكلاً معيناً لها، فيصح أن تكون مكتوبة أو شفوية.", "لا يجوز رفض معذرة المحامي النقابية إلا لأسباب جدية وبقرار معلل.", "إذا قبلت المحكمة المعذرة، يُبلَّغ المتخلف حكماً بالموعد الجديد."], "trap": "شطب الدعوى بسبب غياب المدعي ليس وجوبياً على المحكمة (سلطة تقديرية)، بينما اعتبار المحاكمة بمثابة الوجاهي عند تبلغ الخصم أصولاً وعدم حضوره هو حكم آلي — لا تخلط بين الحالتين من حيث درجة إلزامية القرار.", "example": "مدعى عليه بالقامشلي بُلّغ أصولاً باستدعاء الدعوى ولم يحضر الجلسة الأولى — تجري المحاكمة بحقه بمثابة الوجاهي، ولا يحق له لاحقاً الادعاء بأن الحكم غيابي وغير نافذ."}, {"title": "الوحدة ٨ — تنسيب الجلسة", "points": ["يُقصد بتنسيب الجلسة: تأجيل جلسة المحاكمة لأسباب لا تتعلق بالخصوم، كأن يصادف يوم الجلسة عطلة رسمية.", "في حال تنسيب الدعوى لأي سبب كان، يُعلَن الميعاد الجديد على لوحة إعلانات المحكمة.", "يعتبر الإعلان عن الموعد الجديد على اللوحة تبليغاً أصولياً لكل من كان حاضراً أو مبلّغاً قبل جلسة التنسيب."], "trap": "التنسيب لا يحتاج تبليغاً فردياً جديداً لكل خصم — الإعلان على لوحة إعلانات المحكمة وحده كافٍ ويُعد تبليغاً أصولياً، بشرط أن يكون الخصم قد سبق تبليغه أو حضر قبل جلسة التنسيب.", "example": "صادف موعد جلسة محاكمة بمحكمة الحسكة عطلة رسمية، فأُجّلت الجلسة تلقائياً (تنسيب) وأُعلن الموعد الجديد على لوحة إعلانات المحكمة فقط، دون الحاجة لتبليغ كل خصم شخصياً."}, {"title": "الوحدة ٩ — النيابة العامة كخصم أصلي وطرف منضم", "points": ["تُعتبر النيابة العامة خصماً أصلياً في الحالات التي ينص عليها القانون وفي قضايا الجنسية.", "إذا كانت النيابة العامة خصماً أصلياً، يحق لها سلوك جميع طرق الطعن، ولا يجوز ردها، ويجوز الحكم عليها بالمصاريف.", "إن لم تُدخَل النيابة العامة في القضايا التي يجب إدخالها فيها بصفتها خصماً أصلياً، يُعتبر الحكم باطلاً.", "أجاز الشرع للنيابة العامة أن تتدخل كطرف منضم في قضايا: الإدارة العامة أو الأحوال الشخصية، وقضايا عديمي الأهلية والقاصرين والأوقاف الخيرية، وقضايا تعيين المرجع والدفع بعدم الاختصاص الموضوعي أو النوعي، وقضايا رد القضاء ومخاصمته والتفليسة والصلح الواقي.", "في جميع الدعاوى التي تكون فيها النيابة العامة طرفاً منضماً: لا يجوز للخصوم تقديم أقوال أو مذكرات جديدة بعد كلامها، إذ يكون لها الكلام الأخير، ولا يُحكم عليها بالمصاريف، ولا يجوز الطعن على أقوالها ولا طلب ردها كممثل نيابة عامة منضمة.", "إن لم تتدخل النيابة العامة كطرف منضم في القضايا التي يجوز (لا يجب) لها التدخل فيها، فلا يترتب على ذلك بطلان الحكم."], "trap": "الفرق الحاسم: عدم إدخال النيابة العامة كخصم أصلي في القضايا الواجب إدخالها فيها → بطلان الحكم. أما عدم تدخلها كطرف منضم في قضايا التدخل الجوازي → لا بطلان. لا تخلط بين الحالتين (الوجوب والجواز).", "example": "دعوى تتعلق بالجنسية لا بد فيها من إدخال النيابة العامة كخصم أصلي، وإلا كان الحكم الصادر فيها باطلاً؛ أما دعوى تتعلق بقاصر فيجوز للنيابة التدخل كطرف منضم دون أن يكون تدخلها شرطاً لصحة الحكم."}, {"title": "الوحدة ١٠ — سير الجلسة، الغرامة، والإثبات عند غياب المدعى عليه", "points": ["يبدأ إجراء المحاكمة بالمناداة على الخصوم.", "إذا حضر المدعى عليه بالذات أو بواسطة محاميه في دعوى بسيطة أو مستعجلة، يمكنه أن يطلب إرجاء الجلسة.", "مقدار الغرامة في حال تأخر أحد الخصوم عن إيداع دفاعه: من ٥٠٠ إلى ٢٠٠٠ ليرة سورية، والحكم بهذه الغرامة وجوبي.", "يؤذن الكلام أولاً للمدعي أو وكيله.", "إذا سكت المدعى عليه أو تخلف عن الحضور، يجوز للمحكمة أن تعتبر تخلفه مسوغاً لقبول الإثبات بالبينة الشخصية (الشهادة) أو بالقرائن، حتى في الأحوال التي لا يجيز فيها القانون الإثبات بغير الكتابة.", "السبب الذي يعطي المحكمة صلاحية قبول الإثبات بالشهادة عند غياب المدعى عليه: قرينة الغياب ذاتها.", "لم يأذن المشرع للمحكمة أن تحكم للمدعي بدعواه لمجرد عدم تقديم المدعى عليه أدلة الإثبات أو سكوته — يبقى على المدعي عبء تقديم أدلته."], "trap": "غياب المدعى عليه أو سكوته يُسهّل قواعد الإثبات (يسمح بالشهادة بدل الكتابة) لكنه لا يُعفي المدعي من إثبات دعواه أصلاً — لا تفترض أن غياب الخصم يعني الحكم التلقائي لصالح المدعي.", "example": "مدعى عليه بالقامشلي تغيّب عن الجلسة في دعوى تستلزم أصلاً الإثبات بالكتابة (كعقد بيع)، فسمحت المحكمة للمدعي بإثبات واقعته بالشهادة استثناءً بسبب قرينة الغياب، لكنها لم تحكم له تلقائياً دون أن يقدم دليلاً فعلياً."}, {"title": "الوحدة ١١ — إقفال باب المرافعة والمداولة وإصدار الحكم", "points": ["يقفل باب المرافعة بعد انتهاء الخصوم من تقديم دفوعهم، ووفق الاجتهاد القضائي يمكن أن يكون الإقفال صريحاً أو ضمنياً.", "لا يُعد قراراً للتدقيق في الأوراق قبل انتهاء الخصوم من دفوعهم إقفالاً لباب المرافعة.", "يصح أن تصدر المحكمة بعد إقفال باب المرافعة قراراً إعدادياً كإجراء خبرة أو سماع شهود أو توجيه يمين.", "يمكن تقديم مذكرة استكمال واحدة خطية بعد إقفال باب المرافعة، خلال ثلاثة أيام تلي الإقفال، هدفها استكمال بعض النقاط وتصحيحها.", "المداولة: هي تبادل وجهات النظر بين القضاة المجتمعين سراً تمهيداً لإعداد الحكم، وتخص قضاء الجماعة فقط ولا تُطبَّق بشأن قضاء الفرد.", "تقليب القاضي الفرد لوجهات النظر قبل إعداد الحكم لا يشكل مداولة بالمعنى القانوني.", "تكون المداولة سراً، وإفشاء سرها لا يؤدي إلى بطلان الحكم لكنه يعرّض القاضي الذي أفشاه للمساءلة.", "يجوز للمحكمة أثناء المداولة أن تسمع أحد الخصوم أو وكيله، بشرط أن يكون ذلك بحضور خصمه.", "تصدر الأحكام بإجماع الآراء أو بأكثريتها؛ فإن لم تتوافر الأكثرية من رأيين، انضم الفريق الأقل عدداً (الذي يضم أحدث القضاة) إلى أحد الرأيين بعد أخذ الآراء مرة ثانية.", "لا يجوز لرئيس المحكمة أن ينفرد بإصدار الحكم وفق رأيه الشخصي.", "إذا صدر الحكم بالأكثرية، فعلى الأقلية أن تدوّن أسباب مخالفتها على مسودة مستقلة عن نسخة الحكم الأصلية، وترد الأكثرية على أسباب المخالفة على نسخة الحكم الأصلية ذاتها.", "يجب أن يكون القضاة الذين اشتركوا في المداولة حاضرين وقت تلاوة الحكم.", "يجب النطق بالحكم في جلسة علنية دائماً، حتى لو قررت المحكمة إجراء المحاكمة سراً."], "trap": "مسودة رأي الأقلية المخالف تُدوَّن على محضر مستقل، بينما رد الأكثرية على تلك المخالفة يُدوَّن على نسخة الحكم الأصلية نفسها — لا تخلط مكان تدوين كل منهما.", "example": "في محكمة استئناف مؤلفة من ثلاثة قضاة نظرت قضية بالحسكة، خالف أحدهم الرأي الأكثري فدوّن أسباب مخالفته في محضر مستقل، بينما ضمّن باقي القضاة ردهم على هذه المخالفة في نسخة الحكم الأصلية ذاتها."}, {"title": "الوحدة ١٢ — بيانات الحكم وبطلانه والمصاريف", "points": ["يجب أن تتضمن ورقة الحكم: اسم المحكمة وتاريخ إصداره، أسماء القضاة المشتركين، ممثل النيابة العامة الذي أبدى رأيه، أسماء الخصوم ونسبهم وصفاتهم وحضورهم وغيابهم وأسماء وكلائهم، خلاصة طلبات الخصوم ودفوعهم وأدلتهم وحججهم القانونية، رأي النيابة العامة، ومنطوق الحكم وأسبابه.", "إذا تخلف بيان أو أكثر من بيانات الحكم، فإن بطلانه رهين بحسب الأصل بعدم تحقق الغاية من البيان المتخلف أو المعيب — أي تطبيق نفس نظرية الغاية من الإجراء.", "نسخة الحكم الأصلية (مسودة الحكم): يجب أن تشتمل على منطوقه وأسبابه، وتُحفَظ في الملف ولا تُعطى صور منها.", "لزوم الحكم بالمصاريف يتعلق بالنظام العام.", "إذا تعدد المحكوم عليهم، جاز للمحكمة قسمة المصاريف وأتعاب المحاماة بينهم بالتساوي أو بنسبة مصلحة كل منهم في الدعوى (هذا الحكم جوازي).", "لا يُلزَم المحكوم عليهم بالتضامن بالمصاريف وأتعاب المحاماة إلا إذا كانوا متضامنين في أصل الحكم ذاته.", "يمكن للمحكمة إلزام الخصم الذي ربح الدعوى كلها أو بعضها بالمصاريف في حالات: إذا كان الحق مسلَّماً به من المحكوم عليه، أو أقرّ المحكوم عليه بصحة الدعوى جملة وتفصيلاً، أو تسبب المحكوم له بإنفاق مصاريف لا فائدة منها.", "إذا أخفق كل من الخصمين في بعض طلباته، جاز للمحكمة أن تحمل كل خصم ما دفعه من المصاريف."], "trap": "الفوز بالدعوى لا يعني بالضرورة الإعفاء من المصاريف — يمكن إلزام الطرف الرابح بالمصاريف في حالات محددة (كإقراره المسبق بالحق أو تسببه بمصاريف غير مبررة)، وهذه نقطة تُختبر بكثرة لأنها تبدو غير منطقية للوهلة الأولى.", "example": "مدعٍ في الحسكة ربح دعوى كان المدعى عليه قد أقر بصحتها كاملة قبل رفعها، فحمّلته المحكمة المصاريف رغم كسبه الدعوى لأنه تسبب بلا داعٍ بإنفاق مصاريف كان يمكن تجنبها."}, {"title": "الوحدة ١٣ — تفسير وتصحيح الحكم", "points": ["طلب تفسير الحكم يُقدَّم بالأوضاع المعتادة لرفع الدعوى (لا بمذكرة أو استدعاء بسيط)، ويرد على الحكم الذي يكون منطوقه غامضاً.", "لا يجوز للمحكمة أن تتخذ قراراً بالتفسير من تلقاء نفسها، ولم يحدد المشرع ميعاداً معيناً لتقديم طلب التفسير، ويُنظر الطلب في جلسة علنية تطبيقاً للقواعد العامة.", "يُقدَّم طلب التفسير إلى المحكمة التي أصدرت الحكم ذاتها.", "إذا أغفلت المحكمة الحكم في بعض الطلبات الموضوعية، جاز لأصحاب العلاقة رفع دعوى جديدة أمام المحكمة ذاتها إذا لم يطعنوا في الحكم.", "سلطة تصحيح الحكم من الأخطاء المادية البحتة (كتابية أو حسابية) تكون للمحكمة التي أصدرت الحكم، وتصدر قرارها من تلقاء ذاتها أو بناءً على طلب أحد الخصوم، من غير مرافعة، دون حاجة لدعوة أطراف الخصوم.", "إذا تجاوزت المحكمة حقها في التصحيح فأحدثت تغييراً جوهرياً في الحكم، يجوز الطعن في القرار الجديد بطرق الطعن العادية.", "إذا كان الحكم موضوع التصحيح قابلاً للاستئناف، فإن قرار التصحيح ذاته يقبل الطعن بالاستئناف أيضاً.", "إذا رفضت المحكمة طلب التصحيح، فلا يجوز الطعن في قرار الرفض مستقلاً عن الحكم الأصلي."], "trap": "التفسير يُقدَّم كدعوى مستقلة بالأوضاع المعتادة، بينما التصحيح يُتَّخذ بقرار من تلقاء نفس المحكمة دون حاجة لدعوى جديدة أو مرافعة — لا تخلط بين إجراءي التفسير (رسمي كدعوى) والتصحيح (بسيط وسريع).", "example": "صدر حكم بالحسكة يتضمن خطأً حسابياً في مبلغ التعويض، فصححته المحكمة ذاتها من تلقاء نفسها دون الحاجة لدعوة الخصوم لجلسة، لأن الخطأ مادي بحت."}, {"title": "الوحدة ١٤ — الدفوع الشكلية وترتيبها", "points": ["الدفوع بعدم قبول الدعوى التي لا تتعلق بالنظام العام: لا تثيرها المحكمة من تلقاء نفسها، كالدفع بوجود اتفاق تحكيم بين الخصوم.", "أثر الحكم بعدم قبول الدعوى يختلف بحسب سبب الدفع: إذا كان السبب رفع الدعوى قبل أوانها، فلا يمنع الحكم من رفعها مجدداً بعد حلول الأجل؛ أما إذا كان السبب انتفاء الصفة، فيمنع الحكم من رفع الدعوى نفسها إلا من ذي الصفة الصحيحة.", "يجب على الخصوم أن يبينوا جميع طلباتهم ودفوعهم دفعة واحدة.", "الدفوع الشكلية التي يجب إبداؤها قبل التعرض لموضوع الدعوى وقبل أي دفع أو طلب آخر (تحت طائلة سقوط الحق فيها): الدفع بعدم اختصاص المحكمة، والدفع ببطلان مذكرات الدعوة، والدفع بإحالة الدعوى إلى محكمة أخرى أو بوجود دعوى أخرى مرتبطة بها.", "الدفوع المتعلقة بالنظام العام (كعدم الاختصاص النوعي أو القيمي أو الولائي) يصح إثارتها في أي مرحلة من مراحل الدعوى، حتى أمام محكمة الاستئناف لأول مرة.", "يسقط حق الطاعن بالدفع بعدم الاختصاص المحلي أو ببطلان الإجراءات إن لم يُثره في أول استدعاء طعنه.", "يجوز تقديم دفوع جديدة أمام محكمة الاستئناف إذا كانت متصلة بطلبات جديدة وردت خلال سير الدعوى ولم تكن مقصّرة أصلاً."], "trap": "لا تُطرح كل الدفوع بنفس الترتيب: الدفوع الشكلية (اختصاص محلي، بطلان الإجراءات) تسقط إن لم تُثَر أولاً قبل الموضوع، بينما الدفوع المتعلقة بالنظام العام (كالاختصاص النوعي أو القيمي) تبقى مقبولة في أي مرحلة — هذا التمييز بين نوعي الدفوع من أكثر النقاط اختباراً.", "example": "محامٍ بالقامشلي دفع بعدم اختصاص المحكمة محلياً بعد الدخول في موضوع الدعوى مباشرة، فسقط حقه بهذا الدفع لأنه لم يثره أولاً؛ لكن لو كان الدفع بعدم الاختصاص النوعي لبقي مقبولاً حتى لو أثير متأخراً."}, {"title": "الوحدة ١٥ — إدخال الغير وطلب الضمان", "points": ["يحق للمدعي أن يطلب إدخال شخص في الدعوى إذا كان يصح اختصامه عند رفع الدعوى ابتداءً، ويُقدَّم طلب الإدخال بواسطة استدعاء أو بمذكرة، دون اشتراط اتباع الأوضاع المعتادة لرفع الدعوى.", "الغرض من تبليغ الشخص المُدخَل صورة عن طلب إدخاله: تمكينه من ممارسة حقه في الدفاع.", "يجب على المحكمة إجابة الخصم إلى طلب تأجيل الدعوى إذا طلب إدخال ضامن.", "يمكن للمحكمة أن تفصل بين الحكم في الدعوى الأصلية وطلب الضمان عندما ترى ضرورة للتفريق بينهما.", "إذا تبين للمحكمة أن طلب الضمان لا أساس له، يجوز لها أن تحكم على طالب الضمان بالتعويض عن التأخير الذي سببه هذا الطلب.", "طبيعة سلطة المحكمة في قرار إدخال الغير من تلقاء نفسها: تقديرية (جوازية) لا إلزامية.", "يجوز للمحكمة أن تُدخل من تلقاء نفسها: من كان مختصماً في الدعوى في مرحلة سابقة، ومن تربطه بأحد الخصوم رابطة تضامن أو عدم قابلية للتجزئة يقبل التزامه بها.", "اختصام الغير يشكّل استثناءً على القاعدة العامة بعدم توسيع نطاق الخصومة."], "trap": "طلب الإدخال يختلف شكلاً عن رفع دعوى جديدة — لا يشترط له اتباع الأوضاع المعتادة لرفع الدعوى (استدعاء رسمي كامل)، بل يكفي استدعاء بسيط أو مذكرة؛ هذا يميزه عن رفع دعوى مستقلة.", "example": "مدعٍ في دعوى بالحسكة اكتشف أثناء المحاكمة أن شخصاً ثالثاً ضامن للمدين الأصلي، فطلب إدخاله بمذكرة بسيطة دون الحاجة لرفع دعوى جديدة مستقلة ضده."}, {"title": "الوحدة ١٦ — التدخل الانضمامي والاختصامي والطلبات العارضة", "points": ["التدخل: هو دخول شخص خارج الخصومة في الدعوى من تلقاء نفسه (بخلاف الإدخال الذي يتم من غير رضاه بقرار من الخصوم أو المحكمة).", "حتى يصح التدخل يتعين توفر شرطين: المصلحة والارتباط.", "التدخل الانضمامي: دخول شخص خارج الخصومة من تلقاء نفسه ليضم نفسه إلى أحد الخصوم دون أن يطلب حكماً لنفسه.", "التدخل الاختصامي: دخول شخص خارج الخصومة من تلقاء نفسه طالباً الحكم لنفسه لا لأحد الخصوم.", "لم يذكر المشرع أحكاماً خاصة حول التدخل الانضمامي، وترك مسألة أثره على المتدخل وعلى غيره من الخصوم للفقه والاجتهاد القضائي.", "يكون التدخل بواسطة استدعاء أو بمذكرة، دون حاجة لاتباع إجراءات تقديم الدعوى ابتداءً — وكذلك الطلبات العارضة لم يستلزم المشرع بشأنها اتباع تلك الإجراءات.", "يُبلَّغ استدعاء التدخل للخصوم قبل موعد الجلسة، ولا يُقبل التدخل بعد إقفال باب المرافعة.", "شرط قبول الطلب العارض غير المذكور صراحة في العقد: إذن المحكمة رهناً بارتباطه بالدعوى الأصلية.", "يحق للمدعي أن يقدم أكثر من نوع من الطلبات العارضة إذا توفرت شروطها.", "إذا قدم المدعي طلباً عارضاً غير مصرَّح باستدعائه الأصلي (شكلياً)، يُعامَل بعدم القبول."], "trap": "لا تخلط بين التدخل الانضمامي (يدعم أحد الخصوم دون طلب حكم لنفسه) والتدخل الاختصامي (يطلب حكماً مستقلاً لنفسه) — الفرق جوهري في طبيعة الطلب وليس فقط في طريقة الدخول.", "example": "شخص علم أن قريبه طرف في دعوى ملكية بالقامشلي، فتدخل انضمامياً لدعم موقف قريبه دون أن يطالب لنفسه بأي حكم مستقل؛ لو طالب لنفسه بملكية العقار لكان تدخله اختصامياً."}, {"title": "الوحدة ١٧ — وقف الخصومة وانقطاعها", "points": ["سلطة المحكمة في وقف الخصومة بسبب مسألة أولية: جوازية (تقديرية).", "وفق الاجتهاد القضائي، تستأنف الدعوى سيرها بقوة القانون بعد انقضاء مدة الوقف الاتفاقي بين الخصوم، ولو لم يتقدم أحدهم بطلب لمتابعة السير.", "أسباب انقطاع الخصومة بحكم القانون، وردت على سبيل الحصر: وفاة أحد الخصوم، فقد صفة من كان يباشر الخصومة عن أحدهم، زوال أهلية أحد الخصوم (كالجنون).", "الانقطاع يكون بحكم القانون تلقائياً من وقت حدوث سببه، ولو لم تعلم المحكمة به.", "يترتب على انقطاع الخصومة: وقف جميع مواعيد المرافعات الجارية، وبطلان جميع الإجراءات التي حصلت أثناء الانقطاع.", "البطلان المترتب على اتخاذ إجراء أثناء انقطاع الخصومة: بطلان نسبي، يحق لمن شُرع لمصلحته أن يتنازل عنه، ولا يجوز للمحكمة إثارته من تلقاء نفسها.", "تستأنف الدعوى سيرها بناء على طلب أحد ذوي العلاقة، بتبليغ مذكرة الاستئناف بعد الانقطاع إلى من يقوم مقام الخصم المتوفى أو الذي فقد أهليته أو زالت صفته.", "للمحكمة سلطة الفصل في الدعوى رغم وجود سبب الانقطاع إذا كانت الدعوى مهيأة للحكم، أي إذا أبدى الخصوم أقوالهم وطلباتهم الختامية قبل حدوث سبب الانقطاع."], "trap": "الانقطاع يوقف المواعيد فقط ولا يُبطل الإجراءات السابقة على حدوثه، لكنه يُبطل ما اتُّخذ من إجراءات أثناء فترة الانقطاع ذاتها — لا تخلط بين أثر الانقطاع على ما قبله (سليم) وما أثناءه (باطل نسبياً).", "example": "توفي أحد الخصوم في دعوى بالحسكة أثناء سيرها — تنقطع الخصومة تلقائياً من لحظة الوفاة، وأي إجراء يُتَّخذ بعدها قبل استئناف السير رسمياً يكون باطلاً بطلاناً نسبياً يمكن التنازل عنه من صاحب المصلحة."}, {"title": "الوحدة ١٨ — عدم صلاحية القاضي ورده وتنحيه", "points": ["أسباب عدم صلاحية القاضي: تتعلق بالنظام العام، وتتوفر إذا كانت الخصومة قائمة سواء كانت مدنية أم جزائية.", "إذا صدر عمل من القاضي رغم توافر سبب من أسباب عدم صلاحيته، فإن هذا العمل يكون باطلاً، ويصح سلوك طرق الطعن استناداً إلى هذا العيب.", "إذا وقع الزواج أو المصاهرة بين قاضيين ضمن هيئة واحدة أثناء نظرها الدعوى، فعلى القاضي الأحدث عملاً أن يتنحى ويطلب نقله.", "أسباب رد القاضي: لا تتعلق بالنظام العام، ووردت على سبيل الحصر، منها: أن يكون له أو لزوجه أو لأصهاره حتى الدرجة الرابعة مصلحة مباشرة أو غير مباشرة في الدعوى، أو وجود عداوة سابقة بينه وبين أحد الخصوم، أو كون أحد الخصوم خادماً للقاضي أو اعتاد مؤاكلته أو مساكنته أو قبول هدية منه.", "الادعاء يُعد سبباً من أسباب رد القاضي، ويمكن إثبات المداواة (الخصومة الشخصية) بين القاضي وأحد المتداعين بكافة وسائل الإثبات لأنها واقعة مادية.", "وفق اجتهاد محكمة النقض: العلاقة الحميمية/الصداقة الحميمة وفق صياغة النص الحالية ليست من أسباب الرد صراحة.", "التنحي نوعان: تنحٍّ وجوبي، وتنحٍّ جوازي.", "يجب على القاضي أن يتنحى وجوبياً في حالتين حصراً: إذا كان قد سبق له نظر الدعوى، أو إذا كان في رؤية الدعوى ما يخشى معه الإخلال بالنزاهة.", "التنحي الجوازي: طلبه جائز للقاضي وليس واجباً، كأن يستشعر الحرج لأي سبب آخر (عدا أسباب الرد الصريحة)، مثل كونه خطيباً لابنة أحد الخصوم، أو مشرفاً على رسالة دكتوراه أحدهم.", "إذا توفر سبب من أسباب رد القاضي ولم يطلب الخصوم رده، فإن استمراره بنظر الدعوى يُعرّضه للمساءلة تطبيقاً للقواعد العامة، ويقع عمله باطلاً إذا كان السبب من أسباب عدم الصلاحية بالذات."], "trap": "عدم الصلاحية (نظام عام، لا يمكن التنازل عنها) ≠ الرد (ليست نظاماً عاماً، محصورة، تحتاج طلباً من الخصم) ≠ التنحي (مبادرة القاضي نفسه). ثلاثة مفاهيم متجاورة لكنها مختلفة في الطبيعة القانونية ومن يبادر بها.", "example": "قاضٍ بالحسكة كان قد نظر ذات الدعوى في درجة سابقة، فهو ملزم بالتنحي وجوبياً؛ أما لو كان بينه وبين أحد الخصوم مجرد صداقة عادية غير حميمة فهذا ليس سبباً كافياً للرد أو التنحي الوجوبي."}, {"title": "الوحدة ١٩ — طلب رد القاضي: الإجراءات والمحكمة المختصة", "points": ["إذا خلا استدعاء طلب رد القاضي من ذكر السبب أو الأدلة المؤيدة له، يُرد الطلب شكلاً.", "يجب على كاتب المحكمة رفع استدعاء طلب الرد إلى مرجعه خلال أربع وعشرين ساعة.", "على القاضي المطلوب رده أن يجيب كتابياً على وقائع الرد وأسبابه خلال الأيام الثلاثة التالية لتبليغه.", "الحكم بمصادرة التأمين وقيده إيراداً للخزينة عند رفض طلب الرد: وجوبي؛ أما الحكم بغرامة إضافية (من ألف إلى خمسة آلاف ليرة سورية لصندوق التعاون بوزارة العدل): جوازي.", "تنظر محكمة النقض في طلب الرد إذا كان القاضي المطلوب رده: قاضي صلح، أو قاضي تنفيذ، أو قاضي بداية، أو قاضي استئناف، أو قاضياً عقارياً، أو أحد ممثلي النيابة العامة أمام محكمة النقض عندما يكون خصماً منضماً (لا أصلياً — فإن كان خصماً أصلياً فلا يجوز رده).", "تنظر محكمة النقض بطلب الرد أيضاً إذا كان القاضي المطلوب رده من قضاة محكمة الاستئناف بحيث لا يبقى من عددهم من يكفي للحكم، أو من قضاة محكمة النقض نفسها.", "لا يجوز الطعن بالحكم الصادر عن محكمة الاستئناف سواء بقبول طلب رد القاضي أو برفضه.", "الطعن بالحكم الصادر عن محكمة النقض برد طلب الرد: يُقدَّم باستدعاء إلى المحكمة التي أصدرت الحكم، خلال الأيام الثمانية التالية ليوم صدوره؛ ويرسل كاتب المحكمة استدعاء الطعن إلى محكمة الاستئناف خلال الثلاثة الأيام التالية لوقوع الطعن به.", "على ديوان محكمة النقض إعادة ملف الدعوى إلى المحكمة التي أصدرت الحكم المنقوض خلال اليومين التاليين لصدور حكم النقض.", "لا يترتب على مجرد تقديم طلب رد القاضي وقف السير في الدعوى الأصلية، ما لم تأمر المحكمة بذلك صراحة.", "يترتب على قبول طلب رد القاضي شكلاً: وقف السير في الدعوى الأصلية بقوة القانون.", "إذا بتّ القاضي المطلوب رده بالدعوى الأصلية ثم قُضي بقبول طلب رده، يُعتبر الحكم الصادر منه باطلاً حتى لو اكتسب الدرجة القطعية."], "trap": "مجرد تقديم طلب الرد لا يوقف السير في الدعوى (يحتاج أمراً صريحاً من المحكمة)، بينما قبول الطلب شكلاً يوقف السير تلقائياً بقوة القانون — فرق حاسم بين «مجرد التقديم» و«القبول الشكلي».", "example": "محامٍ في الحسكة قدّم طلب رد قاضٍ في محكمة البداية، فاستمرت الدعوى الأصلية دون توقف إلى أن قبلت المحكمة المختصة الطلب شكلاً، وعندها فقط توقف السير بقوة القانون تلقائياً."}, {"title": "الوحدة ٢٠ — الأحكام الابتدائية والنهائية والمبرمة، الانعدام", "points": ["الأحكام الابتدائية: هي التي تقبل الطعن بالاستئناف.", "الأحكام النهائية: هي التي تقبل الطعن بالنقض (تُسمى أيضاً الحكم الصادر بالدرجة الأخيرة).", "الأحكام المبرمة: هي التي لا تقبل الطعن لا بالاستئناف ولا بالنقض.", "الحكم المكتسب الدرجة القطعية: يُطلق على الحكم الذي كان قابلاً للطعن، ثم صار غير قابل له (بفوات الميعاد مثلاً).", "الأحكام المعدومة: هي التي فقدت ركناً من أركانها الجوهرية، مثل صدور الحكم عن قاضٍ من غير القانون أن يصدره من ثلاثة، أو صدوره على خصومة لم تنعقد بسبب عدم تبليغ المدعى عليه استدعاء الدعوى، أو صدور الحكم على المدعى عليه الذي كان متوفى قبل رفع الدعوى.", "الإبرام يغطي البطلان ولو كان متعلقاً بالنظام العام (إذا صدر الحكم باطلاً وصار مبرماً، لا يمكن الطعن فيه بسبب البطلان بعد الإبرام)، لكن الإبرام لا يغطي الانعدام ولا تصححه الإجازة.", "دعوى الانعدام: عدّها الاجتهاد القضائي طريقاً من طرق الطعن غير العادية، وتُقدَّم إلى المحكمة التي أصدرت الحكم المطلوب إعلان انعدامه، ولا ميعاد محدد لسلوكها (خلافاً لطرق الطعن العادية)."], "trap": "البطلان والانعدام مفهومان مختلفان جوهرياً: البطلان يزول أثره بالإبرام (اكتساب الحكم الدرجة القطعية)، أما الانعدام فلا يزول أبداً بمرور الوقت أو بالإبرام — الحكم المعدوم يبقى كأن لم يكن مهما طال الزمن.", "example": "حكم صدر بالحسكة على شخص متوفى فعلاً قبل رفع الدعوى ضده يُعد حكماً معدوماً لا مبرماً ولا باطلاً فقط، ويمكن طلب إعلان انعدامه في أي وقت دون التقيد بميعاد."}, {"title": "الوحدة ٢١ — طرق الطعن العادية: الاستئناف", "points": ["يُقدَّم الاستئناف الأصلي أو التبعي باستدعاء من محامٍ أستاذ بالاستناد إلى سند توكيل.", "يقبل الطعن بالاستئناف: أحكام محاكم الدرجة الأولى.", "يجب أن يشتمل استدعاء الاستئناف — تحت طائلة البطلان للجهالة — على بيان الحكم المستأنف تحديداً نافياً للجهالة وأسباب الاستئناف.", "يُرد الاستئناف إذا أودع المستأنف مبلغاً يقل عن المبلغ المتوجب إيداعه.", "يُسجَّل استدعاء الاستئناف الأصلي في ديوان محكمة الاستئناف التي يقع في مركزها المحكمة التي أصدرت الحكم الأصلي، بينما يُقدَّم الاستئناف التبعي إلى محكمة الاستئناف مباشرة.", "إذا تخلف المستأنف أو المستأنف عليه عن الحضور في الجلسة الأولى، تُحال القضية لجلسة ثانية يُبلَّغ ميعادها.", "إذا تخلف المستأنف عليه وحده بعد حضوره سابقاً، يُحكم بحقه بمثابة الوجاهي.", "إذا تغيب المستأنف والمستأنف عليه معاً، يجوز للمحكمة أن تحكم في موضوع الاستئناف بناءً على وقائع الدعوى وطلبات الخصوم وأقوالهم الختامية المدلى بها قبل الغياب، أو أن تؤجل النظر لجلسة تراجع.", "إذا لم يراجع المستأنف عليه المحكمة خلال ستين يوماً من قرار الترك، تقرر المحكمة شطب استدعاء الاستئناف من تلقاء ذاتها؛ وهذا الشطب مسألة متعلقة بالنظام العام.", "الشطب بعد فوات ميعاد الترك واقع بقوة القانون تلقائياً؛ وقرار المحكمة به لاحقاً يكون كاشفاً لا منشئاً.", "الاستئناف الأصلي يُشطب أمام محكمة الاستئناف بالنسبة إلى المسائل المستأنفة فقط، لا كل الدعوى.", "إذا استُأنف حكم لم يتضمن الفصل في موضوع الدعوى، يُعد الاستئناف مقبولاً شكلاً على أن يعيد إلى المحكمة الأصلية للفصل في الموضوع.", "يسقط الاستئناف التبعي إذا حُكم بعدم قبول الاستئناف الأصلي شكلاً.", "يصح تقديم الاستئناف التبعي بشرط ألا يتجاوز ذلك تاريخ إقفال باب المرافعة."], "trap": "شطب الاستئناف بعد فوات ميعاد الترك (٦٠ يوماً) يقع بقوة القانون تلقائياً، وقرار المحكمة اللاحق به مجرد إعلان كاشف لا يُنشئ الشطب — لا تفترض أن الشطب يبدأ فقط من تاريخ صدور قرار المحكمة بذلك.", "example": "مستأنف بالقامشلي حصل على قرار ترك لملفه، ولم يراجع محكمة الاستئناف خلال ٦٠ يوماً — يقع الشطب تلقائياً بقوة القانون من نهاية اليوم الستين، حتى لو تأخرت المحكمة في إصدار قرار الشطب رسمياً بعد ذلك."}, {"title": "الوحدة ٢٢ — طرق الطعن غير العادية: إعادة المحاكمة، النقض، اعتراض الغير", "points": ["إعادة المحاكمة: يجوز طلبها للأحكام الحائزة قوة القضية المقضية في حالات حددها المشرع حصراً، منها: غش الخصم المؤثر بالحكم، تزوير أوراق بُني عليها الحكم، شهادة زور بُني عليها الحكم، ظهور أوراق منتجة كان الخصم قد حال دون تقديمها، قضاء الحكم بما لم يُطلب أو بأكثر مما طُلب، تناقض منطوق الحكم مع نفسه، صدور حكم على ناقص أهلية لم يُمثَّل تمثيلاً صحيحاً، صدور حكمين متناقضين بذات الصفة والموضوع.", "ميعاد طلب إعادة المحاكمة عمومًا: خمسة عشر يوماً، ويبدأ من اليوم التالي لتاريخ ظهور السبب (كالغش أو التزوير) بحسب كل حالة.", "لا يترتب على طلب إعادة المحاكمة وقف تنفيذ الحكم إلا إذا كان متعلقاً بعين عقار (يقف تنفيذه بقوة القانون في هذه الحالة فقط).", "يجوز للمحكمة أن تقرر وقف تنفيذ الحكم المطلوب فيه إعادة المحاكمة إذا كان يُخشى من التنفيذ ضرر جسيم يتعذر تداركه، لقاء كفالة نقدية تقدرها المحكمة (لا تُقبل الكفالة العينية ولا الشخصية).", "لا تقبل أحكام محكمة النقض الطعن بإعادة المحاكمة إلا في حالة تصديها للموضوع بعد النقض؛ فإذا رفضت الطعن شكلاً أو نقضت دون التصدي للموضوع، فلا تقبل الطعن بإعادة المحاكمة.", "الطعن بالنقض: طريق غير عادي لمراجعة الحكم من الناحية القانونية فقط (لا الواقعية)، وأسبابه حددها المشرع حصراً.", "الأحكام التي تقبل الطعن بالنقض وفق الأصل: الأحكام النهائية، والأحكام الصادرة عن محكمة الصلح بالدرجة الأخيرة، والأحكام الصادرة عن محاكم الاستئناف أو المحاكم الشرعية والمذهبية.", "الأصل أن ميعاد الطعن بالنقض: ثلاثون يوماً.", "يترتب على الطعن بطريق النقض وقف تنفيذ الحكم بقوة القانون.", "يجب أن يُودَع استدعاء الطعن بالنقض من قبل محامٍ أستاذ مسجل في جدول المحامين الأساتذة مدة لا تقل عن عشر سنوات.", "اعتراض الغير: طريق طعن يراجع الحكم من الناحيتين القانونية والموضوعية معاً، ويحق سلوكه لكل شخص لم يكن خصماً ولا ممثلاً في الدعوى، وللدائنين والمدينين المتضامنين وغير القابلين للتجزئة، وللوارث إذا مثّل أحد الورثة التركة بغش أو حيلة.", "اعتراض الغير نوعان: أصلي (يُقدَّم باستدعاء مستقل وفق الإجراءات المعتادة لرفع الدعوى) وطارئ (يُقدَّم أثناء نظر دعوى أخرى دون حاجة لإجراءات مستقلة).", "المشرع لم يحدد ميعاداً واحداً لسقوط الحق في اعتراض الغير سوى التقادم العام.", "إذا أخفق الغير في اعتراضه، يُلزَم بالمصاريف وبغرامة قدرها ألف ليرة سورية وبتعويض خصمه عما أصابه من ضرر."], "trap": "لكل طريق طعن غير عادي ميعاده الخاص: إعادة المحاكمة (١٥ يوماً)، النقض (٣٠ يوماً)، اعتراض الغير (لا ميعاد محدد سوى التقادم العام) — لا تعمم ميعاداً واحداً على الثلاثة.", "example": "شخص لم يكن طرفاً في دعوى ملكية صدر فيها حكم يمس حقه بالحسكة، يمكنه تقديم اعتراض الغير الأصلي في أي وقت لاحق ما لم يسقط حقه بالتقادم العام، بخلاف الطعن بالنقض الذي كان سيُقيَّد بثلاثين يوماً لو كان طرفاً أصلياً في الدعوى."}], "quiz": [{"q": "متى يكون الإجراء باطلاً وفق نظرية بطلان الإجراءات؟", "opts": ["إذا نص القانون صراحة على بطلانه، أو إذا شابه عيب لم تتحقق به الغاية من الإجراء", "في كل حالة مخالفة شكلية بغض النظر عن الغاية", "فقط إذا نص القانون صراحة على البطلان دون غيره", "لا يبطل أي إجراء إلا بطلب من الخصمين معاً"], "a": 0, "legal": "يكون الإجراء باطلاً: إذا نص القانون صراحة على بطلانه، أو إذا شابه عيب بسببه لم تتحقق الغاية من الإجراء.", "simple": "حالتان بديلتان وليس شرطاً مركباً — يكفي توفر إحداهما لقيام البطلان.", "ex": "استدعاء دعوى بالحسكة خلا من بيان جوهري ولم يحقق الغاية المرجوة منه — يُعد باطلاً حتى لو لم ينص القانون صراحة على بطلان هذا النقص بعينه.", "trap": "لا تفترض أن أي مخالفة شكلية تؤدي للبطلان تلقائياً — لازم إما نص صريح أو عدم تحقق الغاية الفعلية من الإجراء."}, {"q": "متى لا يُحكم بالبطلان رغم وجود نص قانوني صريح عليه؟", "opts": ["إذا ثبت أن الغاية من الإجراء قد تحققت رغم العيب", "لا يوجد استثناء ويُحكم بالبطلان دائماً عند وجود نص صريح", "إذا وافق المدعي على تجاوز العيب فقط", "إذا كان العيب بسيطاً من وجهة نظر القاضي"], "a": 0, "legal": "لا يُحكم بالبطلان رغم وجود نص صريح عليه إذا ثبت أن الغاية من الإجراء قد تحققت.", "simple": "النص الصريح على البطلان ليس نهاية المطاف — تحقق الغاية الفعلية يشفي العيب حتى مع وجود النص.", "ex": "ورقة تبليغ بالقامشلي شابها عيب شكلي بسيط، لكن المدعى عليه حضر فعلياً وأبدى دفاعه كاملاً — تحققت الغاية فلا يُحكم بالبطلان رغم وجود نص قد يشير إليه.", "trap": "هذا الاستثناء يجعل نظرية الغاية من الإجراء الحاكمة الفعلية حتى في وجود نصوص بطلان صريحة — لا تعتبر النص وحده كافياً للحكم بالبطلان."}, {"q": "متى يزول البطلان في الإجراءات؟", "opts": ["إذا تنازل عنه من شُرع البطلان لمصلحته، ما لم يكن متعلقاً بالنظام العام", "لا يزول البطلان أبداً بأي حال من الأحوال", "يزول تلقائياً بمرور شهر واحد فقط", "يزول فقط بموافقة القاضي شخصياً"], "a": 0, "legal": "يزول البطلان إذا نزل من شرع لمصلحته عنه؛ وإذا كان بطلان الإجراء متعلقاً بالنظام العام فلا يزول بالتنازل عنه.", "simple": "التنازل يُنهي البطلان النسبي فقط، وليس البطلان المتعلق بالنظام العام.", "ex": "خصم في دعوى بالحسكة تنازل عن الدفع ببطلان تبليغ لمصلحته الشخصية — زال البطلان؛ لكن لو كان البطلان متعلقاً بالنظام العام لما زال بمجرد تنازله.", "trap": "لا تفترض أن كل بطلان يزول بالتنازل — ميّز بين البطلان النسبي (يزول) والمتعلق بالنظام العام (لا يزول مهما تنازل الخصم)."}, {"q": "ما الآثار التي تترتب على تاريخ قيد الدعوى في السجل؟", "opts": ["الآثار المترتبة على تاريخ رفع الدعوى، وقطع التقادم، وسريان فوائد التأخير", "لا يترتب على القيد أي أثر قانوني", "فقط قطع التقادم دون فوائد التأخير", "فقط سريان فوائد التأخير دون قطع التقادم"], "a": 0, "legal": "يترتب من تاريخ قيد الدعوى: الآثار التي تترتب على تاريخ رفع الدعوى، وقطع التقادم، وسريان فوائد التأخير.", "simple": "تاريخ القيد الرسمي في ديوان المحكمة هو اللحظة الحاسمة قانونياً، لا تاريخ التبليغ اللاحق للخصم.", "ex": "دائن في الحسكة قيّد دعواه في ديوان المحكمة قبل يوم واحد من انتهاء مدة التقادم — انقطع التقادم فور القيد رغم أن التبليغ الفعلي للمدين تم لاحقاً.", "trap": "لا تخلط تاريخ القيد (الحاسم لقطع التقادم) بتاريخ التبليغ اللاحق للمدعى عليه — أحياناً يفصل بينهما أيام أو أسابيع."}, {"q": "ما البيانات الإلزامية التي يجب أن يتضمنها استدعاء الدعوى؟", "opts": ["اسم المحكمة، تاريخ التحرير، أسماء الخصوم وموطنهم، موضوع الدعوى، الأوجه القانونية والأدلة", "توقيع القاضي فقط دون أي بيانات أخرى", "اسم المحكمة فقط دون تفاصيل إضافية", "رقم الدعوى السابقة فقط إن وجدت"], "a": 0, "legal": "يتضمن استدعاء الدعوى: اسم المحكمة التي تُرفع الدعوى أمامها، تاريخ تحرير الاستدعاء، اسم كل من المدعي والمدعى عليه ونسبته وموطنه، بيان موضوع الدعوى، عرض الأوجه القانونية التي تؤسس عليها الدعوى، ذكر البيانات والأدلة التي يستند إليها المدعي لتأييد دعواه.", "simple": "بيانات جوهرية متعددة تضمن وضوح الدعوى منذ لحظة تقديمها.", "ex": "دعوى مرفوعة بالقامشلي يجب أن تتضمن اسم محكمة الحسكة المختصة، تاريخ التحرير، أسماء الطرفين وموطنيهما، موضوع النزاع، وأدلة المدعي.", "trap": "غياب أحد هذه البيانات قد يُسقط الاستدعاء بالبطلان فقط إذا لم تتحقق الغاية منه — طبّق نظرية الغاية من الإجراء هنا أيضاً."}, {"q": "متى يجب على المدعى عليه تقديم جوابه الكتابي في الدعاوى الخاضعة لتبادل اللوائح؟", "opts": ["خلال ثمانية أيام من تاريخ تبليغه استدعاء الدعوى", "خلال يوم واحد فقط من التبليغ", "خلال شهر كامل من تاريخ التبليغ", "لا يوجد ميعاد محدد لتقديم الجواب"], "a": 0, "legal": "في الدعاوى الخاضعة لتبادل اللوائح، يجب على المدعى عليه أو وكيله تقديم جواب كتابي خلال ثمانية أيام من تاريخ تبليغه استدعاء الدعوى، مرفقاً بالأوراق المستند إليها مع صور بعدد الخصوم.", "simple": "ثمانية أيام هي المهلة القانونية المحددة لتقديم الجواب الكتابي في هذا النظام تحديداً.", "ex": "شركة بالحسكة رفعت دعوى تجارية خاضعة لتبادل اللوائح — أُمهل المدعى عليه ثمانية أيام لتقديم جوابه الكتابي المرفق بمستنداته.", "trap": "هذه المهلة (٨ أيام) تخص فقط الدعاوى الخاضعة لتبادل اللوائح، ولا تنطبق على الدعاوى البسيطة أو الصلحية أو المستعجلة التي تُعيَّن جلستها فوراً."}, {"q": "من يملك صلاحية تعيين موعد جلسة المحاكمة الأولى في الدعاوى الخاضعة لتبادل اللوائح؟", "opts": ["رئيس المحكمة", "المدعي وحده", "المدعى عليه وحده", "كاتب المحكمة"], "a": 0, "legal": "تعيين جلسة المحاكمة الأولى في الدعوى الخاضعة لتبادل اللوائح من صلاحية رئيس المحكمة، بعد انقضاء ثلاثة أيام من تبليغ جواب المدعى عليه إلى المدعي، أو في اليوم التالي لانقضاء أجل الثمانية أيام.", "simple": "رئيس المحكمة هو من يملك سلطة تحديد موعد الجلسة الأولى بناء على مآل تبادل اللوائح.", "ex": "بعد أن قدّم المدعى عليه جوابه الكتابي خلال المهلة القانونية، حدد رئيس محكمة الحسكة موعد الجلسة الأولى بعد ثلاثة أيام من تبليغ الجواب للمدعي.", "trap": "لا تخلط بين صلاحية رئيس المحكمة بتحديد موعد الجلسة وبين صلاحية القاضي الناظر بالدعوى في مراحل لاحقة — التعيين الأولي حصراً لرئيس المحكمة."}, {"q": "ما الفرق بين القرار الإعدادي والحكم النهائي في معرض تبادل اللوائح؟", "opts": ["القرار الإعدادي لا يُنهي الخصومة (كإجراء الخبرة)، بينما الحكم النهائي يُنهيها", "لا فرق بينهما وهما مترادفان", "القرار الإعدادي يُنهي الخصومة والحكم النهائي لا يُنهيها", "القرار الإعدادي يصدر من كاتب المحكمة فقط"], "a": 0, "legal": "القرار الإعدادي في معرض تبادل اللوائح: هو القرار الذي لا يُعد الدعوى للوصول إلى الحكم المنهي للخصومة، كقرار إجراء الخبرة أو سماع الشهود. الحكم النهائي: يُقصد به الحكم المنهي للخصومة.", "simple": "التمييز جوهري لتحديد أي القرارات يمكن الطعن فيها مستقلة وأيها يُطعن فيها مع الحكم النهائي فقط.", "ex": "قرار محكمة بالقامشلي بإجراء خبرة فنية في نزاع عقاري هو قرار إعدادي، بينما الحكم اللاحق الذي يحسم النزاع نهائياً هو حكم منهٍ للخصومة.", "trap": "لا تخلط بين القرار الإعدادي (لا يُنهي الخصومة، لا يُطعن فيه مستقلاً غالباً) والحكم المنهي للخصومة (نهائي وقابل للطعن مستقلاً)."}, {"q": "ما أثر تأخر رئيس المحكمة عن تعيين موعد الجلسة بعد المواعيد التي حددها الشرع؟", "opts": ["لا يترتب على ذلك أي بطلان", "يترتب على ذلك بطلان الدعوى بأكملها فوراً", "يجب إعادة تقديم استدعاء الدعوى من جديد", "يُحال الملف تلقائياً لمحكمة أخرى"], "a": 0, "legal": "إذا تأخر رئيس المحكمة بتعيين موعد الجلسة عن المواعيد التي حددها الشرع، لا يترتب على ذلك البطلان.", "simple": "المواعيد الخاصة بإجراءات رئيس المحكمة الإدارية ليست مواعيد سقوط أو بطلان، بل تنظيمية فقط.", "ex": "تأخر رئيس محكمة الحسكة في تحديد موعد الجلسة الأولى بضعة أيام عن الموعد المقرر لا يُبطل الدعوى ولا يُلزم بإعادة أي إجراء.", "trap": "لا تخلط هذا النوع من المواعيد التنظيمية (لا يترتب عليها بطلان) بمواعيد الطعن أو الحضور التي يترتب على تجاوزها سقوط الحق أو بطلان الإجراء."}, {"q": "ما المقصود بـ«الدعوى البسيطة» في السياق التشريعي والممارسة العملية؟", "opts": ["الدعوى غير الخاضعة لتبادل اللوائح، والدعوى الصلحية والمستعجلة بقوة القانون", "الدعوى التي تقل قيمتها عن ألف ليرة سورية فقط", "كل دعوى ينظرها قاضٍ منفرد بغض النظر عن نوعها", "دعوى لا يحتاج فيها المدعي لمحامٍ إطلاقاً"], "a": 0, "legal": "المقصود بعبارة «الدعوى البسيطة» في السياق التشريعي والممارسة العملية: الدعوى غير الخاضعة لتبادل اللوائح، وكذلك الدعوى الصلحية والمستعجلة بقوة القانون.", "simple": "تعريف مركب يجمع بين نوعين: الاستثناء من تبادل اللوائح، والدعاوى الصلحية/المستعجلة تلقائياً.", "ex": "دعوى صلحية بسيطة بالحسكة تُعتبر «بسيطة» بقوة القانون دون حاجة لأي قرار خاص، بعكس دعوى بداية غير خاضعة لتبادل اللوائح والتي تحتاج قرار رئيس المحكمة لاعتبارها بسيطة.", "trap": "لا تفترض أن كل الدعاوى البسيطة من نوع واحد — بعضها بسيط بقوة القانون تلقائياً (صلحية/مستعجلة) وبعضها يحتاج قراراً خاصاً من رئيس المحكمة (غير الخاضعة لتبادل اللوائح)."}, {"q": "من يملك صلاحية اعتبار الدعوى بسيطة بقرار خاص؟", "opts": ["رئيس المحكمة وحده", "القاضي الناظر بالدعوى فقط", "كاتب المحكمة", "الجمعية العمومية للمحكمة"], "a": 0, "legal": "يملك صلاحية اعتبار الدعوى بسيطة بقرار خاص رئيس المحكمة فقط، ويصدر هذا القرار أسفل استدعاء الدعوى.", "simple": "صلاحية إدارية حصرية لرئيس المحكمة، لا يشاركه فيها القاضي الناظر بالقضية نفسها.", "ex": "دعوى بداية بالقامشلي وضع رئيس المحكمة على استدعائها قراراً باعتبارها بسيطة، فتُعيَّن جلستها فوراً دون انتظار مهلة تبادل اللوائح.", "trap": "لا تخلط بين رئيس المحكمة (يملك صلاحية اعتبار الدعوى بسيطة) والقاضي الناظر بالدعوى (يتولى إجراءات المحاكمة اللاحقة فقط)."}, {"q": "ما المطلوب من المدعى عليه ووكيله في أول جلسة خصومة في الدعاوى البسيطة؟", "opts": ["تقديم دفوعه وأدلته كاملة دفعة واحدة", "تقديم دفع واحد فقط والباقي لاحقاً", "الحضور فقط دون تقديم أي دفوع", "طلب تأجيل الجلسة إلزامياً"], "a": 0, "legal": "المطلوب من المدعى عليه ووكيله في أول جلسة خصومة في الدعاوى البسيطة: تقديم دفوعه وأدلته كاملة.", "simple": "لا مجال للتجزئة أو التقديم على دفعات في الدعاوى البسيطة — كل شيء يُقدَّم في الجلسة الأولى.", "ex": "محامٍ يمثل مدعى عليه في دعوى بسيطة بالحسكة يجب أن يقدم كل دفوعه وأدلته في الجلسة الأولى ذاتها، لا أن يؤجل بعضها لجلسات لاحقة.", "trap": "قارن هذا مع الدعاوى الخاضعة لتبادل اللوائح التي تسمح بتقديم دفوع وأدلة في مرحلة الاستئناف أيضاً — الدعاوى البسيطة أكثر صرامة من هذه الناحية."}, {"q": "كم هو ميعاد الحضور أمام محاكم الصلح والبداية والاستئناف، وما الحد الأدنى الذي يمكن إنقاصه إليه؟", "opts": ["ثلاثة أيام على الأقل، ويجوز إنقاصه إلى ٢٤ ساعة في حال الضرورة", "يوم واحد فقط دون إمكانية تعديل", "أسبوع كامل لا يجوز إنقاصه أبداً", "ساعة واحدة فقط في كل الحالات"] mple": "الأصل جواز الإنابة، والمنع استثناء يحتاج نصاً صريحاً في سند الوكالة.", "ex": "موكل بالحسكة أراد منع محاميه من إنابة زميل له، فوجب أن ينص على ذلك صراحةً في سند الوكالة، وإلا بقي للمحامي حق الإنابة.", "trap": "لا تفترض أن أي إشارة ضمنية أو عرفية تكفي لمنع الإنابة — يجب أن يكون المنع صريحاً ومكتوباً في سند التوكيل."}, {"q": "من ينوب حكماً عن أستاذه دون حاجة لذكر اسمه أو صك إنابته؟", "opts": ["المحامي المتمرن", "كاتب المحكمة", "المحامي العامل في دعاويه الشخصية فقط", "القاضي المناوب"], "a": 0, "legal": "المحامي المتمرن ينوب حكماً عن أستاذه دون حاجة إلى ذكر اسمه أو صك إنابته.", "simple": "علاقة التمرن المهني تعطي المتمرن حق الإنابة التلقائية عن أستاذه دون شكليات إضافية.", "ex": "محامٍ متمرن بالقامشلي يحضر جلسة نيابة عن أستاذه دون الحاجة لإبراز صك إنابة مستقل، بحكم علاقة التمرن ذاتها.", "trap": "هذا الحكم خاص بالمحامي المتمرن حصراً — لا يجوز مثلاً لكاتب المحكمة أن ينوب حكماً عن أي محامٍ بنفس الطريقة."}, {"q": "عن من يجوز للقضاة والنائب العام ومعاونيه والعاملين في المحاكم التوكل؟", "opts": ["عن أنفسهم في دعاويهم الشخصية، وعن أزواجهم وأقاربهم حتى الدرجة الثانية", "عن أي شخص يطلب ذلك دون قيد", "عن أقاربهم حتى الدرجة السابعة", "لا يجوز لهم التوكل عن أحد إطلاقاً"], "a": 0, "legal": "يجوز للقضاة والنائب العام ومعاونيه والعاملين في المحاكم التوكل عن الغير في دعاويهم الشخصية، وعن أزواجهم وأقاربهم حتى الدرجة الثانية.", "simple": "استثناء ضيق من قاعدة النظام العام (منع القضاة من قبول الوكالة العامة)، مقيد بالنطاق الشخصي والقرابة القريبة فقط.", "ex": "قاضٍ بمحكمة الحسكة يمكنه أن يوكّل نفسه في قضية شخصية تخصه أو تخص زوجته، لكن لا يجوز له التوكل عن جار أو صديق بعيد.", "trap": "قاعدة منع القضاة من قبول الوكالة العامة عن الغير تتعلق بالنظام العام — الاستثناء الشخصي (حتى الدرجة الثانية) لا يفتح الباب لتوكل أوسع."}, {"q": "ما الأصل في قانون أصول المحاكمات بشأن صورة إجراء المحاكمة؟", "opts": ["لا يجوز أن تجري المحاكمة إلا بصورة وجاهية أو بمثابة الوجاهي", "يجوز إجراء المحاكمة غيابياً في كل الأحوال", "المحاكمة الغيابية جائزة فقط في الدعاوى الصلحية", "لا يوجد أصل ثابت ويترك الأمر لتقدي : ["اسم المحكمة وتاريخ الإصدار، أسماء القضاة والخصوم، خلاصة الطلبات والأدلة، رأي النيابة، منطوق الحكم وأسبابه", "توقيع الخصوم فقط دون أي بيانات أخرى", "اسم المحكمة فقط دون تفاصيل إضافية", "رقم الدعوى السابقة فقط إن وجدت"], "a": 0, "legal": "يجب أن تتضمن ورقة الحكم: اسم المحكمة وتاريخ إصداره، أسماء القضاة المشتركين، ممثل النيابة العامة الذي أبدى رأيه، أسماء الخصوم ونسبهم وصفاتهم وحضورهم وغيابهم وأسماء وكلائهم، خلاصة طلبات الخصوم ودفوعهم وأدلتهم وحججهم القانونية، رأي النيابة العامة، ومنطوق الحكم وأسبابه.", "simple": "بيانات شاملة تضمن توثيق كل تفاصيل القضية والقرار الصادر فيها.", "ex": "حكم صادر بالحسكة يجب أن يتضمن كل هذه البيانات مجتمعة ليكون مستوفياً للشكل القانوني المطلوب.", "trap": "غياب بيان أو أكثر من هذه البيانات لا يُبطل الحكم تلقائياً — يخضع لنظرية الغاية من الإجراء ذاتها (هل تحققت الغاية رغم النقص أم لا)."}, {"q": "هل يُبطل غياب أحد بيانات الحكم الحكمَ تلقائياً؟", "opts": ["لا، بطلانه رهين بحسب الأصل بعدم تحقق الغاية من البيان المتخلف أو المعيب", "نعم، يُبطل الحكم تلقائياً في كل الأحوال", "لا يُبطل الحكم أبداً مهما كان البيان الناقص", "يُبطل فقط إذا كان البيان الناقص هو اسم القاضي"], "a": 0, "legal": "إذا تخلف بيان أو أكثر من بيانات الحكم فإن بطلانه مرهون بحسب الأصل بعدم تحقق الغاية من البيان المتخلف أو المعيب.", "simple": "نفس منطق نظرية الغاية من الإجراء يُطبَّق على بيانات الحكم — النقص لا يعني البطلان التلقائي.", "ex": "حكم بالقامشلي أغفل ذكر تفصيل بسيط من دفوع أحد الخصوم دون أن يؤثر ذلك على فهم الحكم أو حقوق الأطراف — لا يُبطَل الحكم لهذا النقص البسيط.", "trap": "لا تطبق قاعدة البطلان التلقائي على بيانات الحكم — يجب دوماً فحص ما إذا كانت الغاية من البيان قد تحققت رغم غيابه أم لا."}, {"q": "هل يلزم الحكم بالمصاريف بالنظام العام؟", "opts": ["نعم، لزوم الحكم بالمصاريف يتعلق بالنظام العام", "لا، الحكم بالمصاريف اختياري تماماً للمحكمة", "يتعلق بالنظام العام فقط في القضايا التجارية", "لا علاقة للمصاريف بمفهوم النظام العام إطلاقاً"], "a": 0, "legal": "لزوم الحكم بالمصاريف يتعلق بالنظام العام.", "simple": "المحكمة ملزمة بالفصل في مسألة المصاريف كجزء من النظام العام الإجرائي، لا كأمر تختياري.", "ex": "أي حكم قضائي بالحسكة يجب أن يتضمن الفصل في المصاريف، لكونه أمراً متعلقاً بالنظام العام لا يجوز إغفاله.", "trap": "كون المسألة متعلقة بالنظام العام يعني أن المحكمة يمكنها إثارتها من تلقاء نفسها ولا يجوز التنازل عنها اتفاقاً بين الخصوم."}, {"q": "متى يجوز إلزام الخصم الذي ربح الدعوى بالمصاريف رغم فوزه؟", "opts": ["إذا كان الحق مسلَّماً به من المحكوم عليه أو تسبب المحكوم له بمصاريف لا فائدة منها", "لا يجوز إلزام من ربح الدعوى بالمصاريف أبداً", "فقط إذا طلب المدعى عليه ذلك صراحة", "يُلزَم دائماً الرابح بنصف المصاريف تلقائياً"], "a": 0, "legal": "يمكن للمحكمة إلزام الخصم الذي ربح الدعوى كلها أو بعضها بالمصاريف في حالات: إذا كان الحق مسلَّماً به من المحكوم عليه، أو أقرّ المحكوم عليه بصحة الدعوى جملة وتفصيلاً، أو تسبب المحكوم له بإنفاق مصاريف لا فائدة منها.", "simple": "الفوز بالدعوى لا يضمن الإعفاء التلقائي من المصاريف — سلوك الطرف الرابح نفسه (كالتسبب بمصاريف غير ضرورية) قد يقلب النتيجة.", "ex": "مدعٍ بالحسكة ربح دعوى كان خصمه قد أقر بصحتها كاملة سابقاً، فحمّلته المحكمة المصاريف رغم كسبه لأنه تسبب بلا داعٍ بإجراءات ونفقات كان يمكن تفاديها.", "trap": "هذه النقطة تبدو غير منطقية لأول وهلة (رابح الدعوى يُحمَّل مصاريفها) لكنها مبنية على معيار «التسبب» و«التسليم المسبق بالحق»، لا على نتيجة الحكم فقط."}, {"q": "كيف تُقسَّم المصاريف وأتعاب المحاماة إذا تعدد المحكوم عليهم؟", "opts": ["بالتساوي أو بنسبة مصلحة كل منهم في الدعوى، وهذا الحكم جوازي", "بالتساوي حصراً دون أي استثناء إلزامياً", "بالتضامن الكامل دوماً بينهم", "لا تُقسَّم وتبقى مسؤولية فردية كاملة لكل واحد"], "a": 0, "legal": "إذا تعدد المحكوم عليهم جاز للمحكمة قسمة المصاريف وأتعاب المحاماة بينهم بالتساوي أو بنسبة مصلحة كل منهم في الدعوى (هذا الحكم جوازي)، ولا يُلزَمون بالتضامن إلا إذا كانوا متضامنين في أصل الحكم ذاته.", "simple": "المحكمة تملك مرونة في توزيع الأعباء المالية بين المحكوم عليهم المتعددين حسب نصيب كل منهم بالدعوى.", "ex": "ثلاثة محكوم عليهم بالحسكة قُسِّمت عليهم المصاريف بنسبة مصلحة كل منهم بالنزاع، لا بالتساوي الحسابي البسيط، لأن مصلحتهم في الدعوى لم تكن متساوية.", "trap": "التضامن بالمصاريف ليس تلقائياً لمجرد تعدد المحكوم عليهم — يُشترط أن يكونوا متضامنين أصلاً في الحكم بالموضوع نفسه."}, {"q": "كيف يُقدَّم طلب تفسير الحكم؟", "opts": ["بالأوضاع المعتادة لرفع الدعوى، لا بمذكرة أو استدعاء بسيط", "بمذكرة بسيطة دون أي شكليات", "شفوياً أمام القاضي مباشرة", "لا يُقدَّم طلب تفسير أصلاً في القانون السوري"], "a": 0, "legal": "طلب تفسير الحكم: يُقدَّم الطلب بالأوضاع المعتادة لرفع الدعوى، ولا يصح تقديمه بمذكرة أو استدعاء بسيط.", "simple": "التفسير دعوى مستقلة بشكلياتها الكاملة، وليس إجراءً بسيطاً كالتصحيح.", "ex": "محامٍ بالحسكة أراد تفسير غموض في منطوق حكم سابق — رفع طلباً وفق الأوضاع الكاملة لرفع الدعوى، لا بمجرد مذكرة موجزة.", "trap": "لا تخلط إجراء التفسير (رسمي، كدعوى كاملة) بإجراء التصحيح (بسيط، من تلقاء نفس المحكمة دون حاجة لدعوى جديدة)."}, {"q": "إلى أي محكمة يُقدَّم طلب تفسير الحكم؟", "opts": ["إلى المحكمة التي أصدرت الحكم ذاتها", "إلى محكمة الاستئناف دوماً بغض النظر عن الدرجة", "إلى محكمة النقض حصراً", "إلى أي محكمة يختارها الطالب"], "a": 0, "legal": "يُقدَّم طلب التفسير إلى المحكمة التي أصدرت الحكم.", "simple": "الاختصاص محصور بذات المحكمة مصدرة الحكم الغامض المطلوب تفسيره.", "ex": "حكم صادر عن محكمة بداية الحسكة يُطلب تفسيره أمام نفس محكمة البداية التي أصدرته، لا أمام محكمة أعلى درجة.", "trap": "لا تفترض أن طلب التفسير يُرفع لمحكمة أعلى — يبقى دوماً أمام ذات المحكمة مصدرة الحكم الأصلي بصرف النظر عن درجتها."}, {"q": "من يملك سلطة تصحيح الحكم من الأخطاء المادية البحتة (كتابية أو حسابية)؟", "opts": ["المحكمة التي أصدرت الحكم، من تلقاء ذاتها أو بناء على طلب، دون مرافعة", "محكمة الاستئناف فقط بصرف النظر عن مصدر الحكم", "محكمة النقض حصراً في كل الحالات", "لا يجوز تصحيح أي خطأ بعد صدور الحكم"], "a": 0, "legal": "سلطة تصحيح الحكم من الأخطاء المادية البحتة (كتابية أو حسابية) تكون للمحكمة التي أصدرت الحكم، وتصدر قرارها من تلقاء ذاتها أو بناء على طلب أحد الخصوم، من غير مرافعة، دون حاجة لدعوة أطراف الخصوم.", "simple": "إجراء سريع ومبسط لا يستلزم جلسة مرافعة كاملة أو دعوة الخصوم.", "ex": "حكم بالقامشلي تضمن خطأً حسابياً بسيطاً في مبلغ التع  أستاذ (لا متمرن فقط) وسند توكيل موثق.", "ex": "محامٍ أستاذ بالحسكة قدم استدعاء استئناف موقعاً منه استناداً لسند توكيل موثق من موكله.", "trap": "لا يكفي أن يكون مقدم الاستدعاء محامياً متمرناً فقط دون صفة الأستاذية — الشرط محدد بمحامٍ أستاذ."}, {"q": "ماذا يجب أن يتضمن استدعاء الاستئناف تحت طائلة البطلان للجهالة؟", "opts": ["بيان الحكم المستأنف تحديداً نافياً للجهالة، وأسباب الاستئناف", "توقيع المستأنف فقط دون أي تفاصيل أخرى", "اسم المستأنف عليه فقط", "رقم الدعوى الأصلية فقط دون أي تفاصيل إضافية"], "a": 0, "legal": "يجب أن يشتمل استدعاء الاستئناف — تحت طائلة البطلان للجهالة — على بيان الحكم المستأنف من أجل تحديده تحديداً نافياً للجهالة، وأسباب الاستئناف.", "simple": "بيانان جوهريان إلزاميان: تحديد الحكم المطعون فيه بدقة، وذكر أسباب الطعن به.", "ex": "استدعاء استئناف بالقامشلي حدد رقم وتاريخ الحكم المستأنف بدقة، وأورد أسباباً واضحة للطعن فيه — استوفى الشرط الشكلي المطلوب.", "trap": "غياب أي من هذين البيانين (تحديد الحكم بدقة، أو أسباب الاستئناف) يؤدي للبطلان بسبب الجهالة تحديداً، لا لأي سبب آخر."}, {"q": "أين يُسجَّل استدعاء الاستئناف الأصلي، وأين يُقدَّم الاستئناف التبعي؟", "opts": ["الأصلي في ديوان محكمة الاستئناف المختصة بمركز المحكمة مصدرة الحكم؛ التبعي إلى محكمة الاستئناف مباشرة", "كلاهما يُقدَّمان إلى المحكمة التي أصدرت الحكم الأصلي", "الأصلي إلى محكمة النقض؛ التبعي إلى محكمة الاستئناف", "كلاهما يُقدَّمان مباشرة لمحكمة النقض"], "a": 0, "legal": "يُسجَّل استدعاء الاستئناف الأصلي في ديوان محكمة الاستئناف التي يقع في مركزها المحكمة التي أصدرت الحكم الأصلي، بينما يُقدَّم الاستئناف التبعي إلى محكمة الاستئناف مباشرة.", "simple": "مسارا تقديم مختلفان: الأصلي عبر ديوان مرتبط جغرافياً بالمحكمة الأصلية، والتبعي مباشرة لمحكمة الاستئناف.", "ex": "استئناف أصلي لحكم صادر عن محكمة بداية الحسكة يُسجَّل في ديوان محكمة استئناف الحسكة ذاتها؛ بينما استئناف تبعي يُقدَّم مباشرة لمحكمة الاستئناف دون المرور بديوان مماثل.", "trap": "لا تخلط مسار تقديم الاستئناف الأصلي (ديوان محكمة استئناف مركز الحكم الأصلي) بمسار التبعي (تقديم مباشر لمحكمة الاستئناف) — إجراءان مختلفان شكلاً."}, {"q": "م function showTab(name){
  document.getElementById('study').classList.toggle('active', name==='study');
  document.getElementById('quiz').classList.toggle('active', name==='quiz');
  document.getElementById('tab-study').classList.toggle('active', name==='study');
  document.getElementById('tab-quiz').classList.toggle('active', name==='quiz');
}

// ===== Render study units =====
function renderStudy(){
  const container = document.getElementById('study');
  let html = '';
  DATA.units.forEach(u=>{
    html += `<div class="unit"><h3>${u.title}</h3><ul>`;
    u.points.forEach(p=> html += `<li>${p}</li>`);
    html += `</ul>`;
    html += `<div class="tag trap"><b>⚠️ فخ امتحاني:</b><span>${u.trap}</span></div>`;
    html += `<div class="tag example"><b>مثال سوري:</b><span>${u.example}</span></div>`;
    html += `</div>`;
  });
  container.innerHTML = html;
}

// ===== Quiz logic =====
let order = [];
let idx = 0;
let score = 0;
let answered = false;

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function initQuiz(){
  order = shuffle(DATA.quiz.map((_,i)=>i));
  idx = 0; score = 0; answered = false;
  updateScoreBadge();
  renderQuestion();
}

function updateScoreBadge(){
  document.getElementById('scoreNum').textContent = score;
}

function renderQuestion(){
  answered = false;
  const total = order.length;
  document.getElementById('qcount').textContent = `سؤال ${idx+1} من ${total}`;
  document.getElementById('progressBar').style.width = (idx/total*100)+'%';

  if(idx >= total){
    renderResult();
    return;
  }

  const qi = DATA.quiz[order[idx]];
  // shuffle options while tracking correct answer text
  const correctText = qi.opts[qi.a];
  const optsShuffled = shuffle(qi.opts.map((t,i)=>({t,orig:i})));

  let html = `<div class="qcard">
    <h4>${idx+1}. ${qi.q}</h4>
    <div id="optsWrap">`;
  optsShuffled.forEach(o=>{
    html += `<button class="opt" data-correct="${o.t===correctText}" onclick="selectOpt(this)">${o.t}</button>`;
  });
  html += `</div>
    <div class="cards4" id="cards4">
      <div class="minicard mc-legal"><span class="lbl">📜 النص القانوني</span>${qi.legal}</div>
      <div class="minicard mc-simple"><span class="lbl">💡 الشرح المبسط</span>${qi.simple}</div>
      <div class="minicard mc-example"><span class="lbl">مثال سوري</span>${qi.ex}</div>
      <div class="minicard mc-trap"><span class="lbl">⚠️ فخ الامتحان</span>${qi.trap}</div>
    </div>
    <button class="nextbtn" id="nextBtn" onclick="nextQuestion()">التالي ←</button>
  </div>`;

  document.getElementById('quizArea').innerHTML = html;
}

function selectOpt(btn){
  if(answered) return;
  answered = true;
  const wasCorrect = btn.getAttribute('data-correct') === 'true';
  const opts = document.querySelectorAll('#optsWrap .opt');
  opts.forEach(o=>{
    o.classList.add('disabled');
    if(o.getAttribute('data-correct')==='true'){
      o.classList.add('correct');
    } else if(o===btn){
      o.classList.add('wrong');
    } else {
      o.classList.add('dim');
    }
  });
  if(wasCorrect){ score++; updateScoreBadge(); }
  document.getElementById('cards4').classList.add('show');
  document.getElementById('nextBtn').classList.add('show');
}

function nextQuestion(){
  idx++;
  renderQuestion();
}

function renderResult(){
  document.getElementById('progressBar').style.width = '100%';
  const total = order.length;
  const pct = Math.round(score/total*100);
  let msg = '';
  if(pct>=90) msg='ممتاز جدًا! مستوى يفتح باب النجاح بامتياز 🌟';
  else if(pct>=75) msg='جيد جدًا! راجع الفخوخ الامتحانية التي أخطأت فيها 💪';
  else if(pct>=50) msg='مستوى مقبول، يحتاج مراجعة أعمق للوحدات الضعيفة 📖';
  else msg='ابدأ بمراجعة قسم الشرح جيدًا قبل إعادة الاختبار 🔁';

  document.getElementById('quizArea').innerHTML = `
    <div class="result">
      <h2>🎉 انتهى الاختبار</h2>
      <div class="big">${score} / ${total}</div>
      <div>نسبة النجاح: <b>${pct}٪</b></div>
      <p>${msg}</p>
      <button class="restartbtn" onclick="initQuiz()">🔄 إعادة الاختبار (ترتيب عشوائي جديد)</button>
    </div>`;
}

renderStudy();
initQuiz();
</script>
